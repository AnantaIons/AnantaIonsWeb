<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Two-mode architecture: black frame, white body, soft-gray fills" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-family);background:var(--color-canvas);padding:20px}
.row{display:flex;gap:16px}
.sw{flex:1}
.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--color-hairline)}
.name{font-size:12px;font-weight:700;color:var(--color-ink);margin-top:8px}
.hex{font-size:11px;color:var(--color-mute)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#ffffff"></div><div class="name">Canvas</div><div class="hex">#ffffff · --surface-page</div></div>
<div class="sw"><div class="chip" style="background:#f7f7f7"></div><div class="name">Surface Soft</div><div class="hex">#f7f7f7 · --surface-soft</div></div>
<div class="sw"><div class="chip" style="background:#000000"></div><div class="name">Surface Dark</div><div class="hex">#000000 · --surface-dark</div></div>
<div class="sw"><div class="chip" style="background:#1a1a1a"></div><div class="name">Surface Elevated</div><div class="hex">#1a1a1a · --surface-elevated</div></div>
</div>
</body></html>
