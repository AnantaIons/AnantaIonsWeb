<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="8px base — xxs (2) to section (64)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-family);background:var(--color-canvas);padding:24px}
.row{display:flex;align-items:flex-end;gap:20px}
.item{text-align:center}
.bar{background:var(--color-primary);border-radius:var(--radius-sm);width:100%}
.n{font-size:11px;color:var(--color-ink);font-weight:700;margin-top:8px}
.v{font-size:10px;color:var(--color-mute)}
</style></head><body>
<div class="row">
<div class="item" style="width:28px"><div class="bar" style="height:2px"></div><div class="n">xxs</div><div class="v">2</div></div>
<div class="item" style="width:28px"><div class="bar" style="height:4px"></div><div class="n">xs</div><div class="v">4</div></div>
<div class="item" style="width:28px"><div class="bar" style="height:8px"></div><div class="n">sm</div><div class="v">8</div></div>
<div class="item" style="width:28px"><div class="bar" style="height:12px"></div><div class="n">md</div><div class="v">12</div></div>
<div class="item" style="width:28px"><div class="bar" style="height:16px"></div><div class="n">lg</div><div class="v">16</div></div>
<div class="item" style="width:28px"><div class="bar" style="height:24px"></div><div class="n">xl</div><div class="v">24</div></div>
<div class="item" style="width:28px"><div class="bar" style="height:32px"></div><div class="n">xxl</div><div class="v">32</div></div>
<div class="item" style="width:40px"><div class="bar" style="height:64px"></div><div class="n">section</div><div class="v">64</div></div>
</div>
</body></html>
