<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Meaning only — never decorative; link amber is the sole prose-link color" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-family);background:var(--color-canvas);padding:20px}
.row{display:flex;gap:16px}
.sw{flex:1}
.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--color-hairline)}
.name{font-size:12px;font-weight:700;color:var(--color-ink);margin-top:8px}
.hex{font-size:11px;color:var(--color-mute)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#e52020"></div><div class="name">Error</div><div class="hex">#e52020</div></div>
<div class="sw"><div class="chip" style="background:#650b0b"></div><div class="name">Error Deep</div><div class="hex">#650b0b</div></div>
<div class="sw"><div class="chip" style="background:#df6500"></div><div class="name">Warning</div><div class="hex">#df6500</div></div>
<div class="sw"><div class="chip" style="background:#ef9100"></div><div class="name">Warning Bright</div><div class="hex">#ef9100</div></div>
<div class="sw"><div class="chip" style="background:#3f8500"></div><div class="name">Success Deep</div><div class="hex">#3f8500</div></div>
<div class="sw"><div class="chip" style="background:#ffbf00"></div><div class="name">Link Amber</div><div class="hex">#ffbf00</div></div>
</div>
</body></html>
