<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-family);background:var(--color-canvas);padding:20px}
.row{display:flex;gap:16px}
.sw{flex:1}
.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--color-hairline)}
.name{font-size:12px;font-weight:700;color:var(--color-ink);margin-top:8px}
.hex{font-size:11px;color:var(--color-mute)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#8c7853"></div><div class="name">Brass</div><div class="hex">#8c7853</div></div>
<div class="sw"><div class="chip" style="background:#b87333"></div><div class="name">Copper</div><div class="hex">#b87333</div></div>
<div class="sw"><div class="chip" style="background:#cd7f32"></div><div class="name">Copper Deep</div><div class="hex">#cd7f32</div></div>
<div class="sw"><div class="chip" style="background:#b76e79"></div><div class="name">Copper Pale</div><div class="hex">#b76e79</div></div>
<div class="sw"><div class="chip" style="background:#f7e7ce"></div><div class="name">Champagne</div><div class="hex">#f7e7ce</div></div>
</div>
</body></html>
