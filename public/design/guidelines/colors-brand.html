<!-- @dsCard group="Colors" viewport="700x150" name="Brand & Accent" subtitle="One saturated gold carries every CTA, active state, and corner square" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-family);background:var(--color-canvas);padding:20px}
.row{display:flex;gap:16px}
.sw{flex:1}
.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--color-hairline)}
.name{font-size:12px;font-weight:700;color:var(--color-ink);margin-top:8px}
.hex{font-size:11px;color:var(--color-mute);font-family:var(--font-family)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#d4af37"></div><div class="name">Primary Gold</div><div class="hex">#d4af37 · --color-primary</div></div>
<div class="sw"><div class="chip" style="background:#b8860b"></div><div class="name">Primary Gold Dark</div><div class="hex">#b8860b · --color-primary-dark</div></div>
<div class="sw"><div class="chip" style="background:#000000"></div><div class="name">On Primary</div><div class="hex">#000000 · --color-on-primary</div></div>
</div>
</body></html>
