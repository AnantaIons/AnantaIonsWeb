<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-family);background:var(--color-canvas);padding:20px}
.row{display:flex;gap:16px}
.sw{flex:1}
.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--color-hairline)}
.name{font-size:12px;font-weight:700;color:var(--color-ink);margin-top:8px}
.hex{font-size:11px;color:var(--color-mute)}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#000000"></div><div class="name">Ink</div><div class="hex">#000000</div></div>
<div class="sw"><div class="chip" style="background:#1a1a1a"></div><div class="name">Body</div><div class="hex">#1a1a1a</div></div>
<div class="sw"><div class="chip" style="background:#757575"></div><div class="name">Mute</div><div class="hex">#757575</div></div>
<div class="sw"><div class="chip" style="background:#898989"></div><div class="name">Stone</div><div class="hex">#898989</div></div>
<div class="sw"><div class="chip" style="background:#a7a7a7"></div><div class="name">Ash</div><div class="hex">#a7a7a7</div></div>
<div class="sw"><div class="chip" style="background:#cccccc"></div><div class="name">Hairline</div><div class="hex">#cccccc</div></div>
<div class="sw"><div class="chip" style="background:#5e5e5e"></div><div class="name">Hairline Strong</div><div class="hex">#5e5e5e</div></div>
</div>
</body></html>
