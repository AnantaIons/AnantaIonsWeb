<!-- @dsCard group="Brand" viewport="700x180" name="Corner Square & Two-Mode Surfaces" subtitle="The one decorative motif; the black-frame / white-body rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-family);background:var(--color-canvas);padding:24px;display:flex;gap:24px}
.card{position:relative;flex:1;background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-sm);padding:24px;height:96px}
.card .sq{position:absolute;top:0;left:0;width:12px;height:12px;background:var(--color-primary)}
.card .t{font-size:17px;font-weight:700;color:var(--color-ink)}
.card .d{font-size:13px;color:var(--color-mute);margin-top:6px}
.dark{flex:1;background:var(--color-surface-dark);border-radius:var(--radius-sm);padding:24px;height:96px;position:relative}
.dark .sq{position:absolute;bottom:16px;left:24px;width:12px;height:12px;background:var(--color-primary)}
.dark .t{font-size:20px;font-weight:700;color:var(--color-on-dark)}
</style></head><body>
<div class="card"><span class="sq"></span><div class="t">Resource card</div><div class="d">White body · hairline border · gold corner square, top-left.</div></div>
<div class="dark"><div class="t">Hero chapter</div><span class="sq"></span></div>
</body></html>
