<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
html,body{margin:0}
.tile{width:1280px;height:854px;display:flex;font-family:var(--font-family)}
.main{width:75%;background:#000;display:flex;align-items:center;justify-content:center}
.mark{color:#fff;font-weight:700;letter-spacing:2px;text-align:center;line-height:1.1}
.mark .sq{display:inline-block;width:56px;height:56px;background:var(--color-primary);vertical-align:middle;margin-right:24px}
.mark .name{font-size:120px}
.strip{width:25%;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="tile">
  <div class="main"><div class="mark"><span class="sq"></span><span class="name">ANANTA<br>IONS</span></div></div>
  <div class="strip">
    <div style="background:#f7e7ce"></div>
    <div style="background:#d4af37"></div>
    <div style="background:#b87333"></div>
    <div style="background:#b8860b"></div>
  </div>
</div>
</body></html>
