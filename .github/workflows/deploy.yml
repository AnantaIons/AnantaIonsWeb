# Builds the site and publishes it to GitHub Pages.
#
# The QA gate runs first, against the built site served at the exact prefix it
# will be deployed under — so accessibility, responsive, structure, SEO, deep
# links, weight and no-JS are all checked on what actually ships. A build that
# fails the audit is never published.
name: Build and deploy

# Every push builds and audits. PUBLISHING IS MANUAL: the deploy job runs only
# on workflow_dispatch, so nothing reaches the public URL until someone asks
# for it. To go live: Actions -> Build and deploy -> Run workflow.
# To publish automatically on every push to a branch again, add
#   if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main'
# to the deploy job, or simply delete the `if:` line below.
on:
  push:
    branches: [main, site-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # A Pages project site is served from /<repo>/, not the domain root.
  # Set this to "/" if you point a custom domain at the site.
  BASE_PATH: /${{ github.event.repository.name }}/
  # Preview deployment: reachable by link, but asks search engines to stay out.
  # Set to 'true' for the real launch — see docs/CONTENT-TODO.md first.
  INDEXABLE: 'false'
  # Where this deployment actually lives, so canonicals and Open Graph point at
  # it rather than at the production domain, which is not live yet.
  SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
  VITE_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # QA drives a real browser. Without this the audit cannot run at all.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build at its deploy prefix
        run: node scripts/serve-dist.mjs & sleep 2
      - name: QA gate
        run: npm run qa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Manual only — see the note at the top of this file.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
